<!-- @dsCard group="Colors" viewport="700x140" name="Text Scale" subtitle="Four warm-tinted text colors" -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px 24px;background:var(--bg);font-family:'Geist',system-ui,sans-serif;display:flex;gap:32px;align-items:center;}</style>
</head>
<body class="theme-stratum">
  <div style="flex:1">
    <div style="font-size:22px;font-weight:600;color:var(--text);letter-spacing:-0.4px;">Primär</div>
    <div style="font-family:'Geist Mono',monospace;font-size:10px;color:var(--text-mute);margin-top:4px;">--text · #2a2a26</div>
  </div>
  <div style="flex:1">
    <div style="font-size:22px;font-weight:500;color:var(--text-dim);">Sekundär</div>
    <div style="font-family:'Geist Mono',monospace;font-size:10px;color:var(--text-mute);margin-top:4px;">--text-dim · #6a665a</div>
  </div>
  <div style="flex:1">
    <div style="font-size:22px;color:var(--text-mute);">Tertiär</div>
    <div style="font-family:'Geist Mono',monospace;font-size:10px;color:var(--text-mute);margin-top:4px;">--text-mute · #8e8979</div>
  </div>
  <div style="flex:1">
    <div style="font-size:22px;color:var(--accent);font-weight:500;">Akzent</div>
    <div style="font-family:'Geist Mono',monospace;font-size:10px;color:var(--text-mute);margin-top:4px;">--accent · sage green</div>
  </div>
</body>
</html>
