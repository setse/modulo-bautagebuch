<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px 24px;background:var(--bg);font-family:'Geist',system-ui,sans-serif;}
.row{display:flex;align-items:baseline;gap:16px;padding:4px 0;border-bottom:1px solid var(--border);}
.row:last-child{border-bottom:none;}
.label{font-family:'Geist Mono',monospace;font-size:9px;color:var(--text-mute);width:80px;flex-shrink:0;letter-spacing:0.04em;text-transform:uppercase;}
</style>
</head>
<body class="theme-stratum">
  <div class="row"><div class="label">3XL · 32px</div><div style="font-size:32px;font-weight:600;letter-spacing:-0.03em;color:var(--text);line-height:1.1;">Architektur-Controlling</div></div>
  <div class="row"><div class="label">2XL · 28px</div><div style="font-size:28px;font-weight:600;letter-spacing:-0.02em;color:var(--text);line-height:1.15;">Projekte · Honorare</div></div>
  <div class="row"><div class="label">XL · 22px</div><div style="font-size:22px;font-weight:600;letter-spacing:-0.01em;color:var(--text);line-height:1.2;">Bürohaus Stadtkrone</div></div>
  <div class="row"><div class="label">H · 14px</div><div style="font-size:14px;font-weight:600;color:var(--text);">Aktive Projekte · Honorar-Status</div></div>
  <div class="row"><div class="label">Body · 12px</div><div style="font-size:12px;color:var(--text-dim);">Grundlagenermittlung · Vorplanung · Entwurfsplanung · Genehmigungsplanung</div></div>
  <div class="row"><div class="label">SM · 10px</div><div style="font-family:'Geist Mono',monospace;font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:var(--text-mute);">Honorar-Umsatz · YTD 2026</div></div>
</body>
</html>
