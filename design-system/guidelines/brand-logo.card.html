<!-- @dsCard group="Brand" viewport="700x160" name="Logo & Mark" subtitle="ModuloMark — 2×2 grid motif, sage accent" -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px 28px;background:var(--bg);display:flex;gap:32px;align-items:center;font-family:'Geist',system-ui,sans-serif;}</style>
</head>
<body class="theme-stratum">
  <!-- Large mark on dark -->
  <div style="width:120px;height:120px;background:var(--text);border-radius:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
    <svg width="64" height="64" viewBox="0 0 24 24" fill="none">
      <rect x="2" y="2" width="9" height="9" fill="#f7f4ec"/>
      <rect x="13" y="2" width="9" height="9" stroke="#f7f4ec" stroke-width="2"/>
      <rect x="2" y="13" width="9" height="9" stroke="#f7f4ec" stroke-width="2"/>
      <rect x="13" y="13" width="9" height="9" fill="#f7f4ec" opacity="0.4"/>
    </svg>
  </div>
  <!-- Sage accent version -->
  <div style="display:flex;flex-direction:column;gap:20px;">
    <div style="display:flex;align-items:center;gap:14px;">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none">
        <rect x="2" y="2" width="9" height="9" fill="oklch(0.50 0.08 145)"/>
        <rect x="13" y="2" width="9" height="9" stroke="oklch(0.50 0.08 145)" stroke-width="2"/>
        <rect x="2" y="13" width="9" height="9" stroke="oklch(0.50 0.08 145)" stroke-width="2"/>
        <rect x="13" y="13" width="9" height="9" fill="oklch(0.50 0.08 145)" opacity="0.4"/>
      </svg>
      <div>
        <div style="font-size:22px;font-weight:600;color:var(--text);letter-spacing:-0.3px;">Modulo</div>
        <div style="font-family:'Geist Mono',monospace;font-size:9px;color:var(--text-mute);letter-spacing:0.04em;margin-top:1px;">STRATUM · ARCHITEKTUR-CONTROLLING</div>
      </div>
    </div>
    <div style="display:flex;gap:12px;align-items:center;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="2" y="2" width="9" height="9" fill="var(--text)"/><rect x="13" y="2" width="9" height="9" stroke="var(--text)" stroke-width="2"/><rect x="2" y="13" width="9" height="9" stroke="var(--text)" stroke-width="2"/><rect x="13" y="13" width="9" height="9" fill="var(--text)" opacity="0.4"/></svg>
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><rect x="2" y="2" width="9" height="9" fill="oklch(0.50 0.08 145)"/><rect x="13" y="2" width="9" height="9" stroke="oklch(0.50 0.08 145)" stroke-width="2"/><rect x="2" y="13" width="9" height="9" stroke="oklch(0.50 0.08 145)" stroke-width="2"/><rect x="13" y="13" width="9" height="9" fill="oklch(0.50 0.08 145)" opacity="0.4"/></svg>
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none"><rect x="2" y="2" width="9" height="9" fill="oklch(0.50 0.08 145)"/><rect x="13" y="2" width="9" height="9" stroke="oklch(0.50 0.08 145)" stroke-width="2"/><rect x="2" y="13" width="9" height="9" stroke="oklch(0.50 0.08 145)" stroke-width="2"/><rect x="13" y="13" width="9" height="9" fill="oklch(0.50 0.08 145)" opacity="0.4"/></svg>
      <div style="font-size:11px;color:var(--text-mute);">18 · 24 · 32px</div>
    </div>
  </div>
  <!-- Sidebar usage example -->
  <div style="flex:1;background:var(--surface-2);border-radius:10px;padding:14px 16px;display:flex;align-items:center;gap:10px;border:1px solid var(--border);">
    <div style="width:32px;height:32px;border-radius:8px;background:oklch(0.50 0.08 145);display:flex;align-items:center;justify-content:center;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><rect x="2" y="2" width="9" height="9" fill="#f7f4ec"/><rect x="13" y="2" width="9" height="9" stroke="#f7f4ec" stroke-width="2"/><rect x="2" y="13" width="9" height="9" stroke="#f7f4ec" stroke-width="2"/><rect x="13" y="13" width="9" height="9" fill="#f7f4ec" opacity="0.4"/></svg>
    </div>
    <div>
      <div style="font-size:14px;font-weight:600;color:var(--text);">Modulo</div>
      <div style="font-family:'Geist Mono',monospace;font-size:10px;color:var(--text-mute);">Hofer · Renner</div>
    </div>
  </div>
</body>
</html>
