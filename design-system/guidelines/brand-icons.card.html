<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;padding:16px 20px;background:var(--bg);font-family:'Geist',system-ui,sans-serif;}
.grid{display:flex;flex-wrap:wrap;gap:12px;}
.ic{display:flex;flex-direction:column;align-items:center;gap:5px;width:52px;}
.ic svg{color:var(--text-dim);}
.ic span{font-family:'Geist Mono',monospace;font-size:8px;color:var(--text-mute);text-align:center;}
</style>
</head>
<body class="theme-stratum">
<div class="grid">
  <script>
  const icons = {
    dashboard:'M3 3h7v7H3zM14 3h7v4h-7zM14 11h7v10h-7zM3 14h7v7H3z',
    project:'M3 6h18M3 12h18M3 18h12',
    clock:'M12 7v5l3 2M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z',
    euro:'M18 6a8 8 0 1 0 0 12M3 10h10M3 14h10',
    team:'M8 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM2 20c.5-3 3-5 6-5s5.5 2 6 5M17 11a3 3 0 1 0 0-6M22 20c-.3-2-1.6-3.6-3.4-4.4',
    reports:'M4 19V5M4 19h16M8 15v-5M12 15V8M16 15v-7',
    search:'M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM21 21l-5-5',
    folder:'M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z',

    download:'M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3',
    filter:'M3 4h18l-7 9v7l-4-2v-5z',
    plus:'M12 5v14M5 12h14',
    check:'M5 12l5 5L20 7',
    calc:'M5 3h14v18H5zM8 7h8M8 11h2M12 11h2M16 11h-.01M8 15h2M12 15h2M16 15h-.01M8 19h6',
    layers:'M12 2 2 8l10 6 10-6zM2 14l10 6 10-6M2 11l10 6 10-6',
    drawing:'M3 3h18v18H3zM3 9h18M9 3v18',
    timer:'M12 7v5l3 2M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM9 1h6',
    settings:'M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6z',
    invoice:'M5 3h10l4 4v14H5zM15 3v4h4M8 12h8M8 16h5',
    play:'M6 4l14 8-14 8V4z',
  };
  document.addEventListener('DOMContentLoaded', () => {
    const grid = document.querySelector('.grid');
    Object.entries(icons).forEach(([name, path]) => {
      grid.innerHTML += `<div class="ic">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="${path}"/></svg>
        <span>${name}</span>
      </div>`;
    });
  });
  </script>
</div>
</body>
</html>
