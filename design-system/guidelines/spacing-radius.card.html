<!-- @dsCard group="Spacing" viewport="700x120" name="Radius & Elevation" subtitle="Corner radii and card shadow system" -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px 24px;background:var(--bg);display:flex;gap:16px;align-items:center;font-family:'Geist',system-ui,sans-serif;}</style>
</head>
<body class="theme-stratum">
  <div style="display:flex;flex-direction:column;align-items:center;gap:8px;flex:1;">
    <div style="width:44px;height:44px;background:var(--surface);border:1px solid var(--border);border-radius:4px;box-shadow:var(--shadow-card);"></div>
    <div style="font-family:'Geist Mono',monospace;font-size:9px;color:var(--text-mute);text-align:center;">sm · 4px<br>--radius-sm</div>
  </div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:8px;flex:1;">
    <div style="width:44px;height:44px;background:var(--surface);border:1px solid var(--border);border-radius:6px;box-shadow:var(--shadow-card);"></div>
    <div style="font-family:'Geist Mono',monospace;font-size:9px;color:var(--text-mute);text-align:center;">md · 6px<br>--radius-md · card</div>
  </div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:8px;flex:1;">
    <div style="width:44px;height:44px;background:var(--surface);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow-card);"></div>
    <div style="font-family:'Geist Mono',monospace;font-size:9px;color:var(--text-mute);text-align:center;">lg · 8px<br>--radius-lg · button</div>
  </div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:8px;flex:1;">
    <div style="width:44px;height:44px;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-raised);"></div>
    <div style="font-family:'Geist Mono',monospace;font-size:9px;color:var(--text-mute);text-align:center;">xl · 12px<br>--shadow-raised</div>
  </div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:8px;flex:1;">
    <div style="width:44px;height:44px;background:var(--surface);border:1px solid var(--border);border-radius:22px;box-shadow:var(--shadow-overlay);"></div>
    <div style="font-family:'Geist Mono',monospace;font-size:9px;color:var(--text-mute);text-align:center;">pill · 999px<br>--shadow-overlay</div>
  </div>
</body>
</html>
