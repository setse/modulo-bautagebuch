<!-- @dsCard group="Spacing" viewport="700x140" name="Space Scale" subtitle="4px grid — --space-1 through --space-8" -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px 24px;background:var(--bg);display:flex;gap:0;align-items:flex-end;}
.swatch{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;}
.bar{background:var(--accent);border-radius:3px;width:28px;}
.label{font-family:'Geist Mono',monospace;font-size:9px;color:var(--text-mute);text-align:center;}
.token{font-family:'Geist Mono',monospace;font-size:8px;color:var(--accent);text-align:center;}
</style>
</head>
<body class="theme-stratum">
  <div class="swatch"><div class="bar" style="height:4px;"></div><div class="label">4px</div><div class="token">--space-1</div></div>
  <div class="swatch"><div class="bar" style="height:8px;"></div><div class="label">8px</div><div class="token">--space-2</div></div>
  <div class="swatch"><div class="bar" style="height:12px;"></div><div class="label">12px</div><div class="token">--space-3</div></div>
  <div class="swatch"><div class="bar" style="height:16px;"></div><div class="label">16px</div><div class="token">--space-4</div></div>
  <div class="swatch"><div class="bar" style="height:20px;"></div><div class="label">20px</div><div class="token">--space-5</div></div>
  <div class="swatch"><div class="bar" style="height:24px;"></div><div class="label">24px</div><div class="token">--space-6</div></div>
  <div class="swatch"><div class="bar" style="height:28px;"></div><div class="label">28px</div><div class="token">--space-7</div></div>
  <div class="swatch"><div class="bar" style="height:32px;"></div><div class="label">32px</div><div class="token">--space-8</div></div>
</body>
</html>
