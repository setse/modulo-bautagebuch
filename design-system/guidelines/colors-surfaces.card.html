<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:#ddd6c3;font-family:'Geist',system-ui,sans-serif;display:flex;gap:10px;align-items:stretch;}</style>
