<!-- @dsCard group="Type" viewport="700x100" name="Type Utilities" subtitle=".m-eyebrow, .m-num, .m-dim, .m-mute" -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px 24px;background:var(--bg);display:flex;gap:28px;align-items:center;flex-wrap:wrap;}</style>
</head>
<body class="theme-stratum">
  <div style="display:flex;flex-direction:column;gap:6px;">
    <span class="m-eyebrow">Honorar-Umsatz · YTD</span>
    <code style="font-family:'Geist Mono',monospace;font-size:9px;color:var(--text-mute);">.m-eyebrow</code>
  </div>
  <div style="display:flex;flex-direction:column;gap:6px;">
    <span class="m-num" style="font-size:18px;font-weight:600;">1.842 €</span>
    <code style="font-family:'Geist Mono',monospace;font-size:9px;color:var(--text-mute);">.m-num</code>
  </div>
  <div style="display:flex;flex-direction:column;gap:6px;">
    <span class="m-dim" style="font-size:13px;">Sekundärtext</span>
    <code style="font-family:'Geist Mono',monospace;font-size:9px;color:var(--text-mute);">.m-dim</code>
  </div>
  <div style="display:flex;flex-direction:column;gap:6px;">
    <span class="m-mute" style="font-size:13px;">Platzhalter · Hilfe</span>
    <code style="font-family:'Geist Mono',monospace;font-size:9px;color:var(--text-mute);">.m-mute</code>
  </div>
  <div style="display:flex;flex-direction:column;gap:6px;">
    <span style="font-size:13px;font-weight:600;color:var(--text);">600</span>
    <code style="font-family:'Geist Mono',monospace;font-size:9px;color:var(--text-mute);">fw-semi · heading</code>
  </div>
  <div style="display:flex;flex-direction:column;gap:6px;">
    <span style="font-size:13px;font-weight:500;color:var(--text);">500</span>
    <code style="font-family:'Geist Mono',monospace;font-size:9px;color:var(--text-mute);">fw-medium · label</code>
  </div>
  <div style="display:flex;flex-direction:column;gap:6px;">
    <span style="font-size:13px;font-weight:400;color:var(--text);">400</span>
    <code style="font-family:'Geist Mono',monospace;font-size:9px;color:var(--text-mute);">fw-regular · body</code>
  </div>
</body>
</html>
