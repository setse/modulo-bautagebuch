:root {
  --font-sans: 'Geist', system-ui, -apple-system, sans-serif;
  --font-mono: 'Geist Mono', ui-monospace, monospace;
}

.theme-stratum {
  --bg: #f0ece2;
  --surface: #f7f4ec;
  --surface-2: #ebe6d8;
  --surface-3: #ddd6c3;
  --border: #c8c0a8;
  --border-strong: #a8a087;
  --text: #2a2a26;
  --text-dim: #6a665a;
  --text-mute: #8e8979;
  --accent: oklch(0.50 0.08 145);  /* sage */
  --accent-dim: oklch(0.50 0.08 145 / 0.18);
  --pos: oklch(0.50 0.08 145);
  --neg: oklch(0.55 0.18 30);
  --warn: oklch(0.65 0.13 70);
  --font-ui: var(--font-sans);
  --font-data: var(--font-mono);
}

/* Density helpers */
.dens-compact { --pad: 8px;  --pad-lg: 12px; --row-h: 26px; --fs-body: 11px; --fs-data: 11px; --fs-h: 13px; --gap: 6px;  }
.dens-regular { --pad: 12px; --pad-lg: 18px; --row-h: 32px; --fs-body: 12px; --fs-data: 12px; --fs-h: 14px; --gap: 8px;  }
.dens-comfy   { --pad: 16px; --pad-lg: 24px; --row-h: 38px; --fs-body: 13px; --fs-data: 13px; --fs-h: 15px; --gap: 12px; }

/* Shared utility primitives */
.m-app      { font-family: var(--font-ui); color: var(--text); background: var(--bg);
              font-size: var(--fs-body, 12px); line-height: 1.4; -webkit-font-smoothing: antialiased; }
.m-num      { font-family: var(--font-data); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.m-mute     { color: var(--text-mute); }
.m-dim      { color: var(--text-dim); }
.m-card     { background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
              box-shadow: 0 1px 0 rgba(0,0,0,0.04), 0 2px 10px rgba(74,68,55,0.06); }
.m-eyebrow  { font-family: var(--font-data); font-size: 10px; letter-spacing: 0.08em;
              text-transform: uppercase; color: var(--text-mute); font-weight: 500; }
.m-divider  { height: 1px; background: var(--border); }
.m-vdivider { width: 1px; background: var(--border); align-self: stretch; }
.m-pill     { display: inline-flex; align-items: center; gap: 4px; padding: 2px 7px;
              font-family: var(--font-data); font-size: 10px; letter-spacing: 0.02em;
              border-radius: 999px; border: 1px solid var(--border-strong); color: var(--text-dim); }
.m-pill-accent { background: var(--accent-dim); color: var(--accent); border-color: transparent; }
.m-pill-pos    { background: color-mix(in oklch, var(--pos) 18%, transparent); color: var(--pos); border-color: transparent; }
.m-pill-neg    { background: color-mix(in oklch, var(--neg) 18%, transparent); color: var(--neg); border-color: transparent; }
.m-pill-warn   { background: color-mix(in oklch, var(--warn) 18%, transparent); color: var(--warn); border-color: transparent; }

/* Sidebar shared shape */
.m-side       { background: var(--surface-2); border-right: 1px solid var(--border); }
.m-side-item  { display: flex; align-items: center; gap: 10px; padding: 8px 14px;
                color: var(--text-dim); font-size: var(--fs-body); cursor: default; border-left: 2px solid transparent; }
.m-side-item.active { color: var(--text); background: var(--surface-2); border-left-color: var(--accent); }

/* Topbar shared */
.m-top { display: flex; align-items: center; gap: 16px; padding: 0 20px; height: 52px;
         background: var(--surface); border-bottom: 1px solid var(--border); }

/* Sparkline helper hook */
.m-spark path { fill: none; stroke: var(--accent); stroke-width: 1.4; }
