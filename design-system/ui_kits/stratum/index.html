/* ── Shared atoms ───────────────────────────────────────────────────────── */
function Card({children,padding=18,header,headerAction,style}) {
  return <div style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:6,
    boxShadow:'0 1px 0 rgba(0,0,0,0.04),0 2px 10px rgba(74,68,55,0.06)',padding:header?0:padding,...style}}>

      <div style={{fontSize:14,fontWeight:600}}>{header.title}</div>
      {header.subtitle&&<div style={{fontSize:11,color:'var(--text-mute)'}}>{header.subtitle}</div>}
      <div style={{flex:1}}/>{headerAction}
    </div>}
    <div style={{padding:header?padding:0}}>{children}</div>
  </div>;
}

function Eyebrow({children,style}) {
  return <div style={{fontFamily:'var(--font-data)',fontSize:10,letterSpacing:'0.08em',textTransform:'uppercase',color:'var(--text-mute)',fontWeight:500,...style}}>{children}</div>;
}

function Pill({children,tone='default',style}) {
  const tones = {
    default:{bg:'transparent',fg:'var(--text-dim)',border:'1px solid var(--border-strong)'},
    pos:{bg:'color-mix(in oklch,var(--pos) 18%,transparent)',fg:'var(--pos)',border:'none'},
    neg:{bg:'color-mix(in oklch,var(--neg) 18%,transparent)',fg:'var(--neg)',border:'none'},
    warn:{bg:'color-mix(in oklch,var(--warn) 18%,transparent)',fg:'var(--warn)',border:'none'},
    accent:{bg:'var(--accent-dim)',fg:'var(--accent)',border:'none'},
  };
  const t=tones[tone]||tones.default;
  return <span style={{display:'inline-flex',alignItems:'center',gap:4,padding:'2px 8px',borderRadius:999,
    fontFamily:'var(--font-data)',fontSize:10,background:t.bg,color:t.fg,border:t.border,...style}}>{children}</span>;
}

function Btn({children,variant='primary',icon,size='md',onClick,style}) {
  const sizes={sm:{p:'5px 10px',fs:11,ir:11},md:{p:'8px 16px',fs:12,ir:12},lg:{p:'10px 20px',fs:13,ir:14}};
  const variants={primary:{bg:'var(--accent)',fg:'var(--surface)',border:'none'},secondary:{bg:'var(--surface)',fg:'var(--text)',border:'1px solid var(--border)'},ghost:{bg:'transparent',fg:'var(--text-dim)',border:'none'}};
  const s=sizes[size]||sizes.md; const v=variants[variant]||variants.primary;
  return <div onClick={onClick} style={{display:'inline-flex',alignItems:'center',gap:6,padding:s.p,fontSize:s.fs,fontWeight:500,
    borderRadius:8,cursor:'pointer',background:v.bg,color:v.fg,border:v.border,...style}}>
    {icon&&<Icon name={icon} size={s.ir}/>}{children}
  </div>;
}

function SollIstBar({ist,soll,w=100,h=5}) {
  const pct=soll>0?Math.min(1.5,ist/soll):0;
  const color=pct>1.05?'var(--neg)':pct<0.85?'var(--accent)':'var(--pos)';
  return <div style={{position:'relative',width:w,height:h,background:'var(--surface-3)',borderRadius:1}}>
    <div style={{position:'absolute',left:0,top:0,height:h,width:Math.min(pct,1)*w,background:color,borderRadius:1}}/>
    {pct>1&&<div style={{position:'absolute',left:Math.min(pct,1)*w,top:0,height:h,width:Math.min(pct-1,0.5)*w,background:'var(--neg)',opacity:0.5,borderRadius:1}}/>}
  </div>;
}

function Donut({pct,size=72,stroke=9,color='var(--accent)',children}) {
  const r=(size-stroke)/2, c=2*Math.PI*r;
  return <div style={{position:'relative',width:size,height:size}}>
    <svg width={size} height={size}>
      <circle cx={size/2} cy={size/2} r={r} stroke="var(--surface-3)" strokeWidth={stroke} fill="none"/>
      <circle cx={size/2} cy={size/2} r={r} stroke={color} strokeWidth={stroke} fill="none"
        strokeDasharray={c} strokeDashoffset={c*(1-Math.max(0,Math.min(1,pct)))}
        transform={`rotate(-90 ${size/2} ${size/2})`}/>
    </svg>
    <div style={{position:'absolute',inset:0,display:'flex',alignItems:'center',justifyContent:'center'}}>{children}</div>
  </div>;
}

function MonthBars({data,w=400,h=64}) {
  const max=Math.max(...data.map(d=>Math.max(d.ist||0,d.plan||0)));
  const bw=w/data.length;
  return <svg width={w} height={h} viewBox={`0 0 ${w} ${h}`} style={{display:'block'}}>
    {data.map((d,i)=>{
      const x=i*bw+2, istH=max>0?(d.ist/max)*(h-14):0, planH=max>0?(d.plan/max)*(h-14):0;
      return <g key={i}>
        <line x1={x} x2={x+bw-4} y1={h-10-planH} y2={h-10-planH} stroke="var(--text-mute)" strokeDasharray="2 2" strokeWidth="1"/>
        <rect x={x+2} y={h-10-istH} width={bw-8} height={istH} fill={d.future?'var(--surface-3)':'var(--accent)'} opacity={d.future?0.4:0.85}/>
        <text x={x+bw/2-2} y={h-1} fontSize="8" fill="var(--text-mute)" textAnchor="middle" fontFamily="var(--font-data)">{d.m}</text>
      </g>;
    })}
  </svg>;
}

                </div>

                <div style={{fontFamily:'var(--font-data)',fontSize:18,marginTop:8,fontWeight:500,color:sel?'var(--accent)':'var(--text-mute)'}}>{lp.anteil} <span style={{fontSize:11}}>%</span></div>
              </div>;
            })}
          </div>

          <div style={{marginTop:16,display:'flex',alignItems:'center',gap:12,paddingTop:16,borderTop:'1px solid var(--border)'}}>
            <Btn variant="secondary">← Zurück</Btn>
            <div style={{flex:1}}>
              <Eyebrow>Σ ausgewählt</Eyebrow>
              <div style={{fontFamily:'var(--font-data)',fontSize:16,fontWeight:600,marginTop:2}}>98% <span style={{color:'var(--text-mute)',fontWeight:400,fontSize:13}}>· 8 von 9 Phasen</span></div>
            </div>
            <Btn>Weiter →</Btn>
          </div>
        </Card>

        <Card padding={22} style={{display:'flex',flexDirection:'column',overflow:'hidden'}}>
          <Eyebrow>Honorar · live</Eyebrow>
          <div style={{fontFamily:'var(--font-data)',fontSize:32,fontWeight:600,letterSpacing:-1,marginTop:6,color:'var(--accent)'}}>€ 218.400</div>
          <div style={{fontSize:12,color:'var(--text-mute)',marginTop:2}}>Grundleistungen netto · 98 % Vollhonorar</div>

          <div style={{marginTop:20,display:'flex',flexDirection:'column',gap:10}}>
            {[
              ['Gebäudeplanung gem. §34','',true],
              ['Anrechenbare Kosten','1.850.000 €',false],
              ['Honorarzone III · Mittelsatz','222.858 €',false],
              ['Leistungsphasen 1–8','98 %',false],
              ['Nebenkosten 6,0 %','13.104 €',false,'mute'],
            ].map(([k,v,head,dim],i)=>(
              <div key={i} style={{display:'flex',justifyContent:'space-between',padding:head?'8px 0 4px':'0',borderBottom:head?'1px solid var(--border)':'none'}}>
                <div style={{fontSize:12,fontWeight:head?600:400,color:head?'var(--text)':dim?'var(--text-mute)':'var(--text-dim)'}}>{k}</div>
                <div style={{fontFamily:'var(--font-data)',fontSize:12,fontWeight:500,color:dim?'var(--text-mute)':'var(--text)'}}>{v}</div>
              </div>
            ))}
          </div>

          <div style={{marginTop:18,padding:14,background:'var(--surface-2)',borderRadius:8}}>
            <Eyebrow>Endbetrag inkl. USt 19 %</Eyebrow>
            <div style={{fontFamily:'var(--font-data)',fontSize:22,fontWeight:600,marginTop:4}}>€ 275.533</div>
          </div>

          <div style={{marginTop:'auto',paddingTop:14,borderTop:'1px solid var(--border)',fontSize:11,color:'var(--text-dim)',display:'flex',alignItems:'center',gap:6}}>
            <Icon name="alert" size={11}/>Honorarvereinbarung gem. § 7 erforderlich
          </div>
        </Card>
      </div>
    </div>
  );
}

/* ── Screen: Auswertungen / Heatmap ─────────────────────────────────────── */
function Auswertungen() {
  const d = Data;
  const colorFor = (r) => {
    if (r==null) return 'var(--surface-2)';
    if (r<0.85) return 'color-mix(in oklch,var(--accent) 60%,var(--surface))';
    if (r<1.0)  return 'var(--pos)';
    if (r<1.05) return 'color-mix(in oklch,var(--pos) 60%,var(--surface))';
    if (r<1.15) return 'var(--warn)';
    return 'var(--neg)';
  };
  const matrix = d.projects.map(p=>d.leistungsphasen.map(lp=>{
    const prog=p.progress[lp.nr-1];
    if(prog===0) return null;
    let r = 0.7+Math.random()*0.7;
    if(p.id==='SAN-302'&&lp.nr===4) r=1.7;
    if(p.id==='BÜR-118'&&lp.nr===6) r=1.18;
    return r;
  }));
  return (
    <div style={{padding:'24px 28px',display:'flex',flexDirection:'column',gap:16,overflow:'hidden',flex:1}}>
      <div style={{display:'flex',alignItems:'baseline',gap:16}}>
        <div>
          <Eyebrow>Auswertungen</Eyebrow>
          <div style={{fontSize:24,fontWeight:600,letterSpacing:-0.5,marginTop:2}}>Soll/Ist-Heatmap</div>
          <div style={{fontSize:12,color:'var(--text-mute)',marginTop:2}}>Stundenverbrauch je Projekt und Leistungsphase · Ist ÷ Soll</div>
        </div>
        <div style={{flex:1}}/>
        <div style={{display:'flex',gap:4}}>
          {['2024','2025','2026','YTD'].map((y,i)=>(
            <Pill key={y} tone={i===3?'accent':'default'} style={{padding:'6px 12px',fontSize:11,cursor:'pointer'}}>{y}</Pill>
          ))}
        </div>
      </div>

      <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:12}}>
        {[
          {e:'Stunden Σ Ist',v:'15.430 h',s:'Soll: 14.620 h · +5,5 %',warn:false},
          {e:'Mehraufwand',v:'+ 810 h',s:'~ 68.040 € intern',warn:true},
          {e:'Phasen mit Überschreitung',v:'6 / 47',s:'aktive LP-Zellen',warn:true},
          {e:'Phasen unter Soll',v:'23 / 47',s:'Effizienzgewinn',warn:false},
        ].map((k,i)=>(
          <Card key={i} padding={14}>
            <Eyebrow>{k.e}</Eyebrow>
            <div style={{fontFamily:'var(--font-data)',fontSize:22,fontWeight:600,marginTop:4,letterSpacing:-0.4,color:k.warn?'var(--neg)':'var(--text)'}}>{k.v}</div>
            <div style={{fontSize:11,color:'var(--text-mute)',marginTop:4}}>{k.s}</div>
          </Card>
        ))}
      </div>

      <Card padding={22} style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden'}}>
        <div style={{display:'flex',alignItems:'baseline',justifyContent:'space-between',marginBottom:14}}>
          <div>
            <div style={{fontSize:16,fontWeight:600}}>Portfolio · Stunden Soll/Ist je Phase</div>
            <div style={{fontSize:12,color:'var(--text-mute)',marginTop:2}}>Klicken Sie eine Zelle für Details</div>
          </div>
          <div style={{display:'flex',alignItems:'center',gap:10,fontSize:10}}>
            {[['< 85%','color-mix(in oklch,var(--accent) 60%,var(--surface))'],['85–100%','var(--pos)'],['100–105%','color-mix(in oklch,var(--pos) 60%,var(--surface))'],['105–115%','var(--warn)'],['> 115%','var(--neg)']].map(([l,c])=>(
              <div key={l} style={{display:'flex',alignItems:'center',gap:4}}>
                <div style={{width:12,height:12,background:c,borderRadius:2}}/>
                <span style={{color:'var(--text-mute)'}}>{l}</span>
              </div>
            ))}
          </div>
        </div>

        <div style={{display:'grid',gridTemplateColumns:'170px 65px repeat(9,1fr) 90px',gap:3,alignItems:'center',fontSize:11,flex:1,overflowY:'auto'}}>
          <div/><div className="m-eyebrow" style={{textAlign:'right',fontSize:9}}>Honorar</div>
          {d.leistungsphasen.map(lp=>(
            <div key={lp.nr} style={{textAlign:'center'}}>
              <div style={{fontFamily:'var(--font-data)',fontSize:12,fontWeight:600}}>LP{lp.nr}</div>
              <div style={{fontSize:9,color:'var(--text-mute)',fontFamily:'var(--font-data)'}}>{lp.anteil}%</div>
            </div>
          ))}
          <div className="m-eyebrow" style={{textAlign:'right',fontSize:9}}>Σ Δ</div>

          {d.projects.map((p,pi)=>{
            const row=matrix[pi];
            const delta=row.reduce((s,r,i)=>r!=null?s+(r-1)*p.planned*d.leistungsphasen[i].anteil/100:s,0);
            return <React.Fragment key={p.id}>
              <div style={{paddingRight:8}}>
                <div style={{fontSize:12,fontWeight:500}}>{p.name}</div>
                <div style={{fontSize:10,color:'var(--text-mute)',marginTop:1}}>{p.id} · LP{p.phase}</div>
              </div>
              <div style={{fontFamily:'var(--font-data)',textAlign:'right',fontSize:11}}>{d.fmtEur(p.fee/1000)}k</div>
              {row.map((r,ci)=>(
                <div key={ci} style={{aspectRatio:'1',maxHeight:40,background:colorFor(r),borderRadius:3,display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer'}}>
                  {r!=null&&<span style={{fontFamily:'var(--font-data)',fontSize:9,fontWeight:600,color:r>0.9&&r<1.15?'#fff':'var(--text)'}}>{Math.round(r*100)}</span>}
                </div>
              ))}
              <div style={{fontFamily:'var(--font-data)',textAlign:'right',fontSize:11,fontWeight:600,color:delta>0?'var(--neg)':'var(--pos)'}}>
                {delta>0?'+':''}{Math.round(delta)} h
              </div>
            </React.Fragment>;
          })}
        </div>

        <div style={{marginTop:12,paddingTop:12,borderTop:'1px solid var(--border)',display:'flex',alignItems:'center',gap:12,fontSize:11,color:'var(--text-dim)'}}>
          <Icon name="alert" size={12}/>
          <span><b>SAN-302 LP4</b> liegt bei 170 % — Bauantrag verzögert sich, Umbauzuschlag prüfen.</span>
          <span style={{marginLeft:'auto',color:'var(--accent)',cursor:'pointer'}}>Heatmap exportieren ↗</span>
        </div>
      </Card>
    </div>
  );
}

/* ── App root ───────────────────────────────────────────────────────────── */
const SCREENS = {
  'Übersicht': Dashboard,
  'Projekte': Projekte,
  'Zeiterfassung': Zeiterfassung,
  'HOAI-Rechner': HoaiRechner,
  'Auswertungen': Auswertungen,
};

function App() {
  const [active, setActive] = React.useState('Übersicht');
  const Screen = SCREENS[active] || Dashboard;
  return (
    <div className="m-app theme-stratum dens-comfy" style={{width:'100vw',height:'100vh',display:'flex',overflow:'hidden'}}>
      <Sidebar active={active} onNav={setActive}/>
      <div style={{flex:1,overflow:'hidden',display:'flex',flexDirection:'column'}}>
        <Screen/>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
